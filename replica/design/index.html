<!doctype html><meta charset="utf-8"><title>Design check</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;font:var(--text-base)/1 var(--font-sans);font-family:var(--font-sans);background:var(--surface);color:var(--text);display:flex;gap:32px;padding:32px;flex-wrap:wrap}
.dark{background:var(--overlay-bg);padding:24px;border-radius:var(--radius-lg)}
.wheel{position:relative;width:var(--wheel-diameter);height:var(--wheel-diameter);border-radius:50%;background:var(--overlay-bg);box-shadow:var(--shadow-wheel);outline:1px solid var(--overlay-border)}
.slot{position:absolute;width:68px;height:56px;display:grid;place-items:center;border-radius:var(--radius-md);background:var(--overlay-surface);color:var(--overlay-text);font:var(--weight-xs) var(--text-xs) var(--font-sans);border:1px solid var(--overlay-border);cursor:pointer;transition:background var(--motion-fast) var(--motion-ease)}
.slot:hover,.slot.on{background:var(--overlay-accent);color:var(--on-overlay-accent);border-color:var(--overlay-accent)}
.slot[aria-disabled=true]{color:var(--overlay-text-muted);cursor:default}
.hole{position:absolute;inset:132px;border-radius:50%;background:var(--overlay-surface);color:var(--overlay-text-muted);display:grid;place-items:center;text-align:center;font:var(--text-xs) var(--font-sans)}
.card{background:var(--bg);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:var(--space-5);width:var(--toast-width)}
.btn{height:40px;padding:0 16px;border-radius:var(--radius-md);border:1px solid var(--border-input);background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--border);border-radius:var(--radius-pill);overflow:hidden;margin:12px 0}.bar i{display:block;width:60%;height:100%;background:var(--accent)}
.muted{color:var(--text-muted);font-size:14px}
</style>
<div class="dark"><div class="wheel" id="w" role="menu" aria-label="Convert to">
<div class="hole">photo.heic<br>1 file</div></div></div>
<div class="card"><b>Converting photo.heic to JPG</b><div class="bar"><i></i></div>
<div class="muted">60% · 2 of 3 files</div><p><button class="btn p">Cancel</button> <button class="btn">Show in folder</button></p></div>
<script>
["JPG","PNG","WebP","AVIF","TIFF","BMP","PDF","GIF"].forEach((t,i,a)=>{const s=document.createElement("button");s.className="slot"+(i==1?" on":"");s.setAttribute("role","menuitem");if(i==7)s.setAttribute("aria-disabled","true");s.textContent=t;
const ang=(i/a.length)*2*Math.PI-Math.PI/2,r=134,c=180;s.style.left=c+Math.cos(ang)*r-34+"px";s.style.top=c+Math.sin(ang)*r-28+"px";document.getElementById("w").append(s)})
</script>
